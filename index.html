<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tracked — Legal</title>
<style>
  :root {
    --accent: #D2603D;
    --bg: #FBF9F5;
    --text: #211D18;
    --neutral600: #7A7062;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    text-align: center;
    padding: 32px;
  }
  .brand-mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 auto 16px;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 0 0 24px;
  }
  a {
    display: block;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    font-size: 16px;
    margin-bottom: 12px;
  }
  a:hover { text-decoration: underline; }
  p { color: var(--neutral600); font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">T</div>
    <h1>Tracked</h1>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms-of-service.html">Terms of Service</a>
  </div>
</body>
</html>
